{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: distributed-information
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.storageGateway.name }}
                port:
                  number: 80
          - path: /planner
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.replicationPlanner.name }}
                port:
                  number: 80
          {{- if .Values.monitoring.enabled }}
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
          {{- end }}
{{- end }}
