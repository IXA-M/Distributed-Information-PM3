apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secrets-broker
  template:
    metadata:
      labels:
        app: secrets-broker
    spec:
      containers:
        - name: secrets-broker
          image: secrets-broker:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: secrets-broker-config
            - secretRef:
                name: secrets-broker-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
