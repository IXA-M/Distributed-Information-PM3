apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log
  namespace: default
  labels:
    app: audit-log
spec:
  replicas: 2                         # Required by project spec
  selector:
    matchLabels:
      app: audit-log
  strategy:
    type: RollingUpdate               # Zero-downtime updates
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: audit-log
    spec:
      containers:
        - name: audit-log
          image: audit-log:latest     # Replace with your registry image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3025

          # ── Environment from ConfigMap ──────────────────────
          envFrom:
            - configMapRef:
                name: audit-log-config

          # ── Environment from Secret ─────────────────────────
          env:
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: audit-log-secret
                  key: KAFKA_BROKER

          # ── Health Check (Liveness) ─────────────────────────
          # Kubernetes restarts the container if this fails
          livenessProbe:
            httpGet:
              path: /health
              port: 3025
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # ── Readiness Check ─────────────────────────────────
          # Kubernetes stops sending traffic if this fails
          readinessProbe:
            httpGet:
              path: /ready
              port: 3025
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # ── Resource Limits ─────────────────────────────────
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

          # ── Persistent Volume for SQLite ────────────────────
          volumeMounts:
            - name: audit-log-storage
              mountPath: /app/data

      volumes:
        - name: audit-log-storage
          persistentVolumeClaim:
            claimName: audit-log-pvc

---
# PersistentVolumeClaim for SQLite database file
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-log-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
