openapi: 3.0.3
info:
  title: Replication Planner API
  version: 1.0.0
  description: Kafka-first planner with health/readiness and a manual planning endpoint for demos.
servers:
  - url: http://localhost:3020
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Database, Kafka producer, and Kafka consumer are ready
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string
  /docs:
    get:
      summary: Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /api-docs:
    get:
      summary: Alias for Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /openapi.yaml:
    get:
      summary: Raw OpenAPI YAML document
      responses:
        "200":
          description: OpenAPI YAML
  /replication/plan:
    post:
      summary: Manual/admin planning endpoint
      description: Normal workflow is Kafka consumer driven; this endpoint exists for assignment demo and smoke testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  example: upload.completed
                event:
                  type: object
      responses:
        "202":
          description: Plan accepted and replication.task.created events published
