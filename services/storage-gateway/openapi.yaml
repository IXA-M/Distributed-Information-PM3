openapi: 3.0.3
info:
  title: Storage Gateway API
  version: 1.0.0
  description: Stores and retrieves chunk bytes and publishes chunk.stored.
servers:
  - url: http://localhost:3019
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Database, Kafka producer, and storage path are ready
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string
  /docs:
    get:
      summary: Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /api-docs:
    get:
      summary: Alias for Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /openapi.yaml:
    get:
      summary: Raw OpenAPI YAML document
      responses:
        "200":
          description: OpenAPI YAML
  /objects/{chunk_id}:
    put:
      summary: Store or replace a chunk object
      parameters:
        - name: chunk_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              properties:
                content_base64:
                  type: string
                content:
                  type: string
      responses:
        "201":
          description: Chunk stored and chunk.stored published
    get:
      summary: Retrieve a chunk object
      parameters:
        - name: chunk_id
          in: path
          required: true
          schema:
            type: string
        - name: raw
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns raw bytes instead of the standard JSON envelope.
      responses:
        "200":
          description: Chunk metadata and content_base64 by default
        "404":
          description: Chunk not found
