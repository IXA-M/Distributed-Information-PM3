openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: Authentication microservice – registration, login, JWT issuance
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Database and Kafka producer are ready
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string
  /docs:
    get:
      summary: Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /api-docs:
    get:
      summary: Alias for Swagger/OpenAPI documentation page
      responses:
        "200":
          description: HTML documentation page
  /openapi.yaml:
    get:
      summary: Raw OpenAPI YAML document
      responses:
        "200":
          description: OpenAPI YAML
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        "201":
          description: User registered successfully
        "409":
          description: Email already taken
  /auth/login:
    post:
      summary: Login and get tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token refreshed
        "401":
          description: Invalid or expired refresh token
