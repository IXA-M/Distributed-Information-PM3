{{- if .Values.services.chunkLocation.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.services.chunkLocation.name }}
  namespace: {{ include "cse474.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.services.chunkLocation.name }}
    {{- include "cse474.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.services.chunkLocation.name }}
  minReplicas: {{ .Values.services.chunkLocation.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.services.chunkLocation.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.chunkLocation.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.chunkLocation.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
