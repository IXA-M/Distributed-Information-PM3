apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.chunkLocation.name }}
  namespace: {{ include "cse474.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.services.chunkLocation.name }}
    {{- include "cse474.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.chunkLocation.service.type }}
  selector:
    app: {{ .Values.services.chunkLocation.name }}
  ports:
    - name: http
      port: {{ .Values.services.chunkLocation.service.port }}
      targetPort: {{ .Values.services.chunkLocation.containerPort }}
