{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "cse474.namespace" . }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: chunk-catalog
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.chunkCatalog.name }}:{{ .Values.services.chunkCatalog.service.port }}"]
      - job_name: chunk-location
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.chunkLocation.name }}:{{ .Values.services.chunkLocation.service.port }}"]
      - job_name: storage-gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.storageGateway.name }}:{{ .Values.services.storageGateway.service.port }}"]
      - job_name: replication-planner
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.replicationPlanner.name }}:{{ .Values.services.replicationPlanner.service.port }}"]
      - job_name: auth-service
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.authService.name }}:{{ .Values.services.authService.service.port }}"]
      - job_name: user-profile-service
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.userProfileService.name }}:{{ .Values.services.userProfileService.service.port }}"]
      - job_name: secrets-broker
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.secretsBroker.name }}:{{ .Values.services.secretsBroker.service.port }}"]
      - job_name: chaos-simulator
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.services.chaosSimulator.name }}:{{ .Values.services.chaosSimulator.service.port }}"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "cse474.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "cse474.namespace" . }}
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ include "cse474.namespace" . }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Distributed Information
        folder: Services
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ include "cse474.namespace" . }}
data:
  distributed-information-dashboard.json: |
    {
      "title": "Distributed Information Services",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        { "type": "stat", "title": "HTTP Requests", "targets": [{ "expr": "sum(service_http_requests_total) or sum(http_requests_total)" }] },
        { "type": "timeseries", "title": "Request Rate", "targets": [{ "expr": "sum(rate(service_http_requests_total[5m])) or sum(rate(http_requests_total[5m]))" }] }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "cse474.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword | quote }}
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "cse474.namespace" . }}
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ include "cse474.namespace" . }}
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ include "cse474.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.monitoring.loki.image }}
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ include "cse474.namespace" . }}
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ include "cse474.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.monitoring.jaeger.image }}
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ include "cse474.namespace" . }}
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
{{- end }}
