{{- if .Values.services.chunkCatalog.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.chunkCatalog.database.name }}
  namespace: {{ include "cse474.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.services.chunkCatalog.database.name }}
    {{- include "cse474.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.services.chunkCatalog.database.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.chunkCatalog.database.name }}
        app.kubernetes.io/name: {{ .Values.services.chunkCatalog.database.name }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.services.chunkCatalog.database.image }}
          ports:
            - containerPort: {{ .Values.services.chunkCatalog.database.port }}
          env:
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.services.chunkCatalog.database.initDatabase | quote }}
          resources:
            {{- toYaml .Values.services.chunkCatalog.database.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.chunkCatalog.database.name }}
  namespace: {{ include "cse474.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.services.chunkCatalog.database.name }}
    {{- include "cse474.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.services.chunkCatalog.database.name }}
  ports:
    - name: mongo
      port: {{ .Values.services.chunkCatalog.database.port }}
      targetPort: {{ .Values.services.chunkCatalog.database.port }}
{{- end }}
