apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-logging
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.services.centralLogging.replicas }}
  selector:
    matchLabels:
      app: central-logging
  template:
    metadata:
      labels:
        app: central-logging
    spec:
      containers:
      - name: central-logging
        image: "{{ .Values.services.centralLogging.image.repository }}:{{ .Values.services.centralLogging.image.tag }}"
        imagePullPolicy: {{ .Values.services.centralLogging.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.services.centralLogging.port }}
        env:
        - name: PORT
          value: "{{ .Values.services.centralLogging.port }}"
        - name: DB_PATH
          value: "{{ .Values.services.centralLogging.dbPath }}"
        - name: KAFKA_BROKER
          value: "{{ .Values.kafka.broker }}"
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.centralLogging.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.services.centralLogging.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: {{ .Values.services.centralLogging.resources.requests.memory }}
            cpu: {{ .Values.services.centralLogging.resources.requests.cpu }}
          limits:
            memory: {{ .Values.services.centralLogging.resources.limits.memory }}
            cpu: {{ .Values.services.centralLogging.resources.limits.cpu }}
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: central-logging-pvc
