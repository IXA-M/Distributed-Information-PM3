apiVersion: v1
kind: Service
metadata:
  name: audit-log-service
  namespace: default
  labels:
    app: audit-log
spec:
  type: ClusterIP             # Internal only — not exposed outside the cluster
  selector:
    app: audit-log            # Routes traffic to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 3025              # Port other services use to reach audit-log
      targetPort: 3025        # Port the container listens on
