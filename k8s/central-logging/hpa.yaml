apiVersion: autoscaling/v2 
kind: HorizontalPodAutoscaler 
metadata: 
  name: central-logging-hpa 
  namespace: cse474-prod 
spec: 
  scaleTargetRef: 
    apiVersion: apps/v1 
    kind: Deployment 
    name: central-logging 
  minReplicas: 2 
  maxReplicas: 10 
  metrics: 
  - type: Resource 
    resource: 
      name: cpu 
      target: 
        type: Utilization 
        averageUtilization: 70 
  - type: Resource 
    resource: 
      name: memory 
      target: 
        type: Utilization 
        averageUtilization: 80 
