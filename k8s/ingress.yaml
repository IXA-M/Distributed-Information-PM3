apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: distributed-information
  namespace: cse474-prod
spec:
  rules:
    - host: distributed-information.local
      http:
        paths:
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: storage-gateway
                port:
                  number: 80
          - path: /planner
            pathType: Prefix
            backend:
              service:
                name: replication-planner
                port:
                  number: 80
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
