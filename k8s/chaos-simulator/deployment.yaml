apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-simulator
  namespace: cse474-prod
  labels:
    app: chaos-simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaos-simulator
  template:
    metadata:
      labels:
        app: chaos-simulator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3002"
    spec:
      containers:
        - name: chaos-simulator
          image: ghcr.io/ixa-m/distributed-information-pm3/chaos-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: chaos-simulator-config
            - secretRef:
                name: chaos-simulator-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
