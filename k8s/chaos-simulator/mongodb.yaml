apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-simulator-db
  namespace: cse474-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-simulator-db
  template:
    metadata:
      labels:
        app: chaos-simulator-db
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: chaos_simulator_db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-simulator-db
  namespace: cse474-prod
spec:
  selector:
    app: chaos-simulator-db
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
