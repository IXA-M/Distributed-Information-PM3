apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secrets-broker
  namespace: cse474-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secrets-broker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
