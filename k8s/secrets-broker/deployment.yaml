apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-broker
  namespace: cse474-prod
  labels:
    app: secrets-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secrets-broker
  template:
    metadata:
      labels:
        app: secrets-broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: secrets-broker
          image: ghcr.io/ixa-m/distributed-information-pm3/secrets-broker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: secrets-broker-config
            - secretRef:
                name: secrets-broker-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
