apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-gateway
  namespace: cse474-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-gateway
  template:
    metadata:
      labels:
        app: storage-gateway
    spec:
      containers:
        - name: storage-gateway
          image: docker.io/ahmedxdarwish/storage-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: distributed-information-config
          env:
            - name: SERVICE_NAME
              value: storage-gateway
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storage-gateway
  namespace: cse474-prod
spec:
  type: ClusterIP
  selector:
    app: storage-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storage-gateway
  namespace: cse474-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storage-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
