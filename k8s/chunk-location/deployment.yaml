apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunk-location
  namespace: cse474-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chunk-location
  template:
    metadata:
      labels:
        app: chunk-location
    spec:
      containers:
        - name: chunk-location
          image: chunk-location:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - src/server.js
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: chunk-location-config
            - secretRef:
                name: chunk-location-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
