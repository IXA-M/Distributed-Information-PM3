apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunk-location-db
  namespace: cse474-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chunk-location-db
  template:
    metadata:
      labels:
        app: chunk-location-db
        app.kubernetes.io/name: chunk-location-db
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: chunk_location
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chunk-location-db
  namespace: cse474-prod
spec:
  selector:
    app: chunk-location-db
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
