name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CHUNK_CATALOG_IMAGE: ghcr.io/${{ github.repository_owner }}/chunk-catalog
  CHUNK_LOCATION_IMAGE: ghcr.io/${{ github.repository_owner }}/chunk-location

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static analysis
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace build/install stage
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            services/chunk-catalog/tests/coverage
            services/chunk-location/tests/coverage

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build chunk-catalog image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: false
          tags: ${{ env.CHUNK_CATALOG_IMAGE }}:${{ github.sha }}

      - name: Build chunk-location image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: false
          tags: ${{ env.CHUNK_LOCATION_IMAGE }}:${{ github.sha }}

  push:
    name: Push
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push chunk-catalog
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: true
          tags: |
            ${{ env.CHUNK_CATALOG_IMAGE }}:${{ github.sha }}
            ${{ env.CHUNK_CATALOG_IMAGE }}:latest

      - name: Build and push chunk-location
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: true
          tags: |
            ${{ env.CHUNK_LOCATION_IMAGE }}:${{ github.sha }}
            ${{ env.CHUNK_LOCATION_IMAGE }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"

      - name: Deploy with Helm
        run: |
          helm upgrade --install cse474 ./chart \
            --set services.chunkCatalog.image.repository=${{ env.CHUNK_CATALOG_IMAGE }} \
            --set services.chunkCatalog.image.tag=${{ github.sha }} \
            --set services.chunkLocation.image.repository=${{ env.CHUNK_LOCATION_IMAGE }} \
            --set services.chunkLocation.image.tag=${{ github.sha }}
