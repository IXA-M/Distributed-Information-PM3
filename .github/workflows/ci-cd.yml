name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.vars.outputs.image_namespace }}
      chunk_catalog_image: ${{ steps.vars.outputs.chunk_catalog_image }}
      chunk_location_image: ${{ steps.vars.outputs.chunk_location_image }}
      audit_log_image: ${{ steps.vars.outputs.audit_log_image }}
      central_logging_image: ${{ steps.vars.outputs.central_logging_image }}
    steps:
      - name: Compute image names
        id: vars
        shell: bash
        run: |
          image_namespace="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_namespace=${image_namespace}" >> "$GITHUB_OUTPUT"
          echo "chunk_catalog_image=ghcr.io/${image_namespace}/chunk-catalog" >> "$GITHUB_OUTPUT"
          echo "chunk_location_image=ghcr.io/${image_namespace}/chunk-location" >> "$GITHUB_OUTPUT"
          echo "audit_log_image=ghcr.io/${image_namespace}/audit-log" >> "$GITHUB_OUTPUT"
          echo "central_logging_image=ghcr.io/${image_namespace}/central-logging" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static analysis
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace build/install stage
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            services/chunk-catalog/tests/coverage
            services/chunk-location/tests/coverage

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build chunk-catalog image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: false
          tags: ${{ needs.prepare.outputs.chunk_catalog_image }}:${{ github.sha }}

      - name: Build chunk-location image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: false
          tags: ${{ needs.prepare.outputs.chunk_location_image }}:${{ github.sha }}

      - name: Build audit-log image
        uses: docker/build-push-action@v6
        with:
          context: ./services/audit-log
          push: false
          tags: ${{ needs.prepare.outputs.audit_log_image }}:${{ github.sha }}

      - name: Build central-logging image
        uses: docker/build-push-action@v6
        with:
          context: ./services/central-logging
          push: false
          tags: ${{ needs.prepare.outputs.central_logging_image }}:${{ github.sha }}

  push:
    name: Push
    runs-on: ubuntu-latest
    needs:
      - prepare
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push chunk-catalog
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: true
          tags: |
            ${{ needs.prepare.outputs.chunk_catalog_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.chunk_catalog_image }}:latest

      - name: Build and push chunk-location
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: true
          tags: |
            ${{ needs.prepare.outputs.chunk_location_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.chunk_location_image }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - prepare
      - push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Lint chart
        run: helm lint ./chart

      - name: Render Helm release
        run: |
          helm template cse474 ./chart \
            --set services.chunkCatalog.image.repository=${{ needs.prepare.outputs.chunk_catalog_image }} \
            --set services.chunkCatalog.image.tag=${{ github.sha }} \
            --set services.chunkLocation.image.repository=${{ needs.prepare.outputs.chunk_location_image }} \
            --set services.chunkLocation.image.tag=${{ github.sha }} \
            --set services.auditLog.image.repository=${{ needs.prepare.outputs.audit_log_image }} \
            --set services.auditLog.image.tag=${{ github.sha }} \
            --set services.centralLogging.image.repository=${{ needs.prepare.outputs.central_logging_image }} \
            --set services.centralLogging.image.tag=${{ github.sha }} \
            > rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml