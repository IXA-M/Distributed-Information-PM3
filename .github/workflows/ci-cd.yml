name: CI/CD

on:
  push:
    branches:
      - main
      - feature/ci-cd-auth-profile
  pull_request:
    branches:
      - main

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ahmedxdarwish

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      ghcr_namespace: ${{ steps.vars.outputs.ghcr_namespace }}
      chunk_catalog_image: ${{ steps.vars.outputs.chunk_catalog_image }}
      chunk_location_image: ${{ steps.vars.outputs.chunk_location_image }}
      storage_gateway_image: ${{ steps.vars.outputs.storage_gateway_image }}
      replication_planner_image: ${{ steps.vars.outputs.replication_planner_image }}
      auth_service_image: ${{ steps.vars.outputs.auth_service_image }}
      user_profile_service_image: ${{ steps.vars.outputs.user_profile_service_image }}
    steps:
      - name: Compute image names
        id: vars
        shell: bash
        run: |
          ghcr_namespace="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_namespace=${ghcr_namespace}" >> "$GITHUB_OUTPUT"
          echo "chunk_catalog_image=${GHCR_REGISTRY}/${ghcr_namespace}/chunk-catalog" >> "$GITHUB_OUTPUT"
          echo "chunk_location_image=${GHCR_REGISTRY}/${ghcr_namespace}/chunk-location" >> "$GITHUB_OUTPUT"
          echo "storage_gateway_image=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/storage-gateway" >> "$GITHUB_OUTPUT"
          echo "replication_planner_image=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/replication-planner" >> "$GITHUB_OUTPUT"
          echo "auth_service_image=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/auth-service" >> "$GITHUB_OUTPUT"
          echo "user_profile_service_image=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/user-profile-service" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static code analysis
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build stage
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start integration test infrastructure
        run: sudo docker compose -f docker-compose.integration-tests.yml up -d
      - name: Wait for infrastructure
        run: |
          echo "Waiting for DBs and Kafka..."
          sleep 60
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage
        env:
          KAFKAJS_NO_PARTITIONER_WARNING: 1
      - name: Stop integration test infrastructure
        if: always()
        run: sudo docker compose -f docker-compose.integration-tests.yml down

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            tests/coverage
            services/*/tests/coverage

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build chunk-catalog image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: false
          tags: ${{ needs.prepare.outputs.chunk_catalog_image }}:${{ github.sha }}

      - name: Build chunk-location image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: false
          tags: ${{ needs.prepare.outputs.chunk_location_image }}:${{ github.sha }}

      - name: Build storage-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/storage-gateway/Dockerfile
          push: false
          tags: ${{ needs.prepare.outputs.storage_gateway_image }}:${{ github.sha }}

      - name: Build replication-planner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/replication-planner/Dockerfile
          push: false
          tags: ${{ needs.prepare.outputs.replication_planner_image }}:${{ github.sha }}

      - name: Build auth-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: false
          tags: ${{ needs.prepare.outputs.auth_service_image }}:${{ github.sha }}

      - name: Build user-profile-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-profile-service
          push: false
          tags: ${{ needs.prepare.outputs.user_profile_service_image }}:${{ github.sha }}

  push:
    name: Push
    runs-on: ubuntu-latest
    needs:
      - prepare
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push chunk-catalog
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-catalog
          push: true
          tags: |
            ${{ needs.prepare.outputs.chunk_catalog_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.chunk_catalog_image }}:latest

      - name: Build and push chunk-location
        uses: docker/build-push-action@v6
        with:
          context: ./services/chunk-location
          push: true
          tags: |
            ${{ needs.prepare.outputs.chunk_location_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.chunk_location_image }}:latest

      - name: Build and push storage-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/storage-gateway/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.storage_gateway_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.storage_gateway_image }}:latest

      - name: Build and push replication-planner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/replication-planner/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.replication_planner_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.replication_planner_image }}:latest

      - name: Build and push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          tags: |
            ${{ needs.prepare.outputs.auth_service_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.auth_service_image }}:latest

      - name: Build and push user-profile-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-profile-service
          push: true
          tags: |
            ${{ needs.prepare.outputs.user_profile_service_image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.user_profile_service_image }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - prepare
      - push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          normalized_config="$(printf '%s' "$KUBE_CONFIG" | tr -d '\r\n ')"

          if printf '%s' "$normalized_config" | base64 -d > ~/.kube/config 2>/dev/null && grep -q '^apiVersion:' ~/.kube/config; then
            echo "Loaded base64-encoded kubeconfig"
          else
            printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          fi

          if ! grep -q '^apiVersion:' ~/.kube/config; then
            echo "::error::KUBE_CONFIG must be either raw kubeconfig YAML or a base64-encoded kubeconfig."
            exit 1
          fi

          chmod 600 ~/.kube/config

          if grep -Eq '127\.0\.0\.1|localhost|kubernetes\.docker\.internal|minikube|docker-desktop|C:\\Users\\' ~/.kube/config; then
            echo "::warning::KUBE_CONFIG points to a local Kubernetes cluster. GitHub Actions cannot reach it, so this run will validate Helm manifests without deploying."
            echo "deploy_mode=mock" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_mode=real" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Helm
        if: steps.kubeconfig.outputs.deploy_mode == 'real'
        run: |
          helm upgrade --install cse474 ./chart \
            --namespace cse474-prod \
            --create-namespace \
            --set services.chunkCatalog.image.repository=${{ needs.prepare.outputs.chunk_catalog_image }} \
            --set services.chunkCatalog.image.tag=${{ github.sha }} \
            --set services.chunkLocation.image.repository=${{ needs.prepare.outputs.chunk_location_image }} \
            --set services.chunkLocation.image.tag=${{ github.sha }} \
            --set imageRegistry=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE} \
            --set services.storageGateway.tag=${{ github.sha }} \
            --set services.replicationPlanner.tag=${{ github.sha }}

      - name: Validate Helm manifests
        if: steps.kubeconfig.outputs.deploy_mode == 'mock'
        run: |
          helm template cse474 ./chart \
            --namespace cse474-prod \
            --set services.chunkCatalog.image.repository=${{ needs.prepare.outputs.chunk_catalog_image }} \
            --set services.chunkCatalog.image.tag=${{ github.sha }} \
            --set services.chunkLocation.image.repository=${{ needs.prepare.outputs.chunk_location_image }} \
            --set services.chunkLocation.image.tag=${{ github.sha }} \
            --set imageRegistry=${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE} \
            --set services.storageGateway.tag=${{ github.sha }} \
            --set services.replicationPlanner.tag=${{ github.sha }} \
            > rendered-manifests.yaml

          test -s rendered-manifests.yaml
          echo "Validated Helm chart rendering for local-only kubeconfig."
