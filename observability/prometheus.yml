global:
  scrape_interval: 15s

scrape_configs:
  - job_name: chunk-catalog
    metrics_path: /metrics
    static_configs:
      - targets:
          - chunk-catalog:3001

  - job_name: chunk-location
    metrics_path: /metrics
    static_configs:
      - targets:
          - chunk-location:3002

  - job_name: storage-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - storage-gateway:80

  - job_name: replication-planner
    metrics_path: /metrics
    static_configs:
      - targets:
          - replication-planner:80

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:3001

  - job_name: user-profile-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-profile-service:3002

  - job_name: secrets-broker
    metrics_path: /metrics
    static_configs:
      - targets:
          - secrets-broker:3001

  - job_name: chaos-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - chaos-simulator:3002
