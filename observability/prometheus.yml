global:
  scrape_interval: 15s

scrape_configs:
  - job_name: storage-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["storage-gateway:80", "localhost:3019"]
  - job_name: replication-planner
    metrics_path: /metrics
    static_configs:
      - targets: ["replication-planner:80", "localhost:3020"]
