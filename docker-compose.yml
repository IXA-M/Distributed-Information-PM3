
# --- Added Auth and User Profile Services ---

services:

  # ── Kafka Infrastructure ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [app-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app-net]

  # ── Auth Service ──────────────────────────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./auth-service/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
      JWT_EXPIRES_IN: 15m
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks: [app-net]

  # ── User Profile Service ──────────────────────────────────────────────────────
  profile-db:
    image: postgres:15-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - profile-db-data:/var/lib/postgresql/data
      - ./user-profile-service/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  user-profile-service:
    build:
      context: ./user-profile-service
      dockerfile: Dockerfile
    depends_on:
      profile-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 3002
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  auth-db-data:
  profile-db-data:
